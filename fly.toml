app = "poland-life-guide-bot"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/bot.db"
  CONTENT_DIR = "/app/content"
  ASSETS_DIR = "/app/assets"
  STATS_PORT = "3000"

[[mounts]]
  source = "bot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
